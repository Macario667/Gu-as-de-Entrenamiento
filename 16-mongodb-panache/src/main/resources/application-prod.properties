# Solo se aplica cuando el perfil "prod" está activo
# Se activa con: java -jar target/quarkus-app/quarkus-run.jar -Dquarkus.profile=prod
app.nombre=InkluSport API (PROD)
app.modo=PRODUCCION

quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}

quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING}
quarkus.mongodb.database=inklusport
quarkus.mongodb.analytics.connection-string=${MONGODB_ANALYTICS_CONNECTION_STRING:${MONGODB_CONNECTION_STRING}}