# Configuración BASE (aplica a todos los perfiles)
quarkus.application.name=inklusport-14-hibernate-orm-panache
quarkus.smallrye-openapi.info-title=InkluSport API

app.nombre=InkluSport API
app.version=1.0.0
app.autor.nombre=Samuel García
app.autor.email=samu@example.com

# Expresión: el valor se compone de otras propiedades
app.bienvenida=Hola desde ${app.nombre} v${app.version}

# Modo por defecto (si ningún perfil lo sobreescribe)
app.modo=DESARROLLO

# Tipos compuestos: duración ISO-8601 y lista separada por comas
app.ventana-reserva=PT30M
app.deportes=baloncesto,atletismo,petanca

# Valor con variable de entorno y valor por defecto:
# se usa OTEL_COLLECTOR_URL si existe; si no, la URL por defecto.
app.otel-colector-url=${OTEL_COLLECTOR_URL:http://localhost:4317}

# Quarkus
quarkus.http.port=8080

# ------------------------------------------------------------------
# CONFIGURACIÓN DE LOGGING (guía 06)
# ------------------------------------------------------------------

# Nivel global por defecto
quarkus.log.level=INFO

# Nivel por categoría (se hereda del nivel global si no se define)
quarkus.log.category."com.inklusport".level=DEBUG
quarkus.log.category."com.inklusport.service".level=INFO
quarkus.log.category."org.jboss.resteasy.reactive".level=WARN

# Formato de la consola (color en terminal)
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Salida a fichero, con rotación por tamaño
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/inklusport.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
# El sufijo de rotación es un patrón de fecha (p. ej. .yyyy-MM-dd)

# Formato JSON para la consola (combinable con el fichero).
# Con quarkus-logging-json cada linea de log se emite como un objeto JSON,
# y las claves del MDC se añaden al propio objeto.
quarkus.log.console.json.enabled=false
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.json.excluded-keys=timestamp,sequence,logger,level,message
quarkus.log.console.json.additional-field."servicio"=inklusport
quarkus.log.console.json.additional-field."version"=1.0.0

# Formato JSON también en el fichero
quarkus.log.file.json.enabled=false
quarkus.log.file.json.mdc.flat-fields=true

# ------------------------------------------------------------------
# CONFIGURACIÓN DE JACKSON (guía 08)
# ------------------------------------------------------------------

# Las fechas se escriben como texto ISO-8601, no como numero
quarkus.jackson.write-dates-as-timestamps=false

# Zona horaria usada al serializar fechas
quarkus.jackson.timezone=Europe/Madrid

# No fallar si el cliente envia campos que el DTO no conoce
quarkus.jackson.fail-on-unknown-properties=false

# No emitir los campos con valor null
quarkus.jackson.serialization-inclusion=NON_NULL

# Cliente REST de ejemplo: consume el endpoint de eventos de esta misma app.
quarkus.rest-client.eventos-api.url=http://localhost:8080
%test.quarkus.rest-client.eventos-api.url=http://localhost:8081

# Configuración de la fuente de datos MySQL
quarkus.datasource.db-kind = mysql
quarkus.datasource.jdbc.url = jdbc:mysql://localhost:3306/inklusport_panache
quarkus.datasource.username = ${DB_USERNAME:root}
quarkus.datasource.password = ${DB_PASSWORD:}

# Base de datos aislada para pruebas: no modifica la base MySQL de desarrollo.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:inklusport;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.log.file.enabled=false

# Habilitar generación de esquema (sólo en dev/test)
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.datasource.db-version=5.5.5

# Tamaño mínimo del Pool.
quarkus.datasource.jdbc.min-size=2

# Límite (Pool) máximo de conexiones.
quarkus.datasource.jdbc.max-size=16

# Tiempo máximo de espera para obtener una conexión disponible.
quarkus.datasource.jdbc.acquisition-timeout=5S

# MongoDB
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=inklusport
quarkus.mongodb.application-name=inklusport-panache
quarkus.mongodb.analytics.connection-string=mongodb://localhost:27017
quarkus.mongodb.analytics.database=inklusport_analytics

quarkus.liquibase-mongodb.change-log=db/changeLog-mongodb.xml
quarkus.liquibase-mongodb.migrate-at-start=true

quarkus.mongodb.metrics.enabled=true

quarkus.mongodb.tracing.enabled=true
# Permite inspeccionar la estructura de los comandos sin 
# Registrar sus valores reales
# Evita FULL en producción porque las trazas podrían 
# exponer datos personales o sensibles.
quarkus.mongodb.tracing.command-detail-level=SANITIZED
