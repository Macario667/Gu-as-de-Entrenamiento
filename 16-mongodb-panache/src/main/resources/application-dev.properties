# Configuración local de desarrollo; no requiere ni modifica MySQL.
app.nombre=InkluSport API (DEV)
app.modo=DESARROLLO

# Servicios de observabilidad locales; se pueden sobrescribir con variables de entorno.
grafana.endpoint=${GRAFANA_ENDPOINT:http://localhost:3000}
otel-collector.url=${OTEL_COLLECTOR_URL:http://localhost:4317}

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:inklusport_dev;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.mongodb.database=inklusport